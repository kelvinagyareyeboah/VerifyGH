services:
  - type: web
    name: verifygh-api
    runtime: docker
    plan: free
    dockerfilePath: Dockerfile
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: DatabaseProvider
        value: Sqlite
      - key: ConnectionStrings__DefaultConnection
        value: Data Source=verifygh.db
      - key: JwtSettings__Secret
        value: VerifyGH_Production_Secret_Key_At_Least_32Chars!
      - key: JwtSettings__Issuer
        value: VerifyGHServer
      - key: JwtSettings__Audience
        value: VerifyGHClient
