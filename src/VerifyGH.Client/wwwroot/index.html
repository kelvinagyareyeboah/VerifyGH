<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VerifyGH - Verified Credential & Portfolio System</title>
    <base href="/" />
    <!-- Google Fonts for MudBlazor -->
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap" rel="stylesheet" />
    <!-- MudBlazor Styles -->
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="VerifyGH.Client.styles.css" rel="stylesheet" />
</head>

<body>
    <div id="app">
        <div
            style="display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; background-color: #09090b; color: #ffffff; font-family: 'Plus Jakarta Sans', sans-serif;">
            <div
                style="font-size: 2rem; font-weight: 800; letter-spacing: -0.03em; margin-bottom: 8px; color: #ffffff;">
                VerifyGH
            </div>
            <div style="font-size: 0.88rem; color: #78716c; margin-bottom: 24px;">
                Verified Credential & Portfolio Platform
            </div>
            <div
                style="width: 36px; height: 36px; border: 2px solid rgba(255,255,255,0.1); border-top: 2px solid #ffffff; border-radius: 50%; animation: spin 0.8s linear infinite;">
            </div>
            <style>
                @keyframes spin {
                    0% {
                        transform: rotate(0deg);
                    }

                    100% {
                        transform: rotate(360deg);
                    }
                }
            </style>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>

    <!-- MudBlazor Script -->
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
